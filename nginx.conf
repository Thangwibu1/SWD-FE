# Rendered by the nginx image's envsubst step into conf.d/default.conf.
# Only defined env vars are substituted, so nginx runtime vars ($host...) stay.
#   BACKEND_UPSTREAM       host:port of the evaluator API (default backend:4000)
#   NGINX_LOCAL_RESOLVERS  set by the entrypoint from /etc/resolv.conf
# Keep a caller-supplied X-Request-Id; generate one only when missing.
map $http_x_request_id $req_id {
  default $http_x_request_id;
  ''      $request_id;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve the upstream per request so nginx starts even when the backend
  # is not up yet (static proxy_pass hostnames fail at boot).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $backend_upstream http://${BACKEND_UPSTREAM};

  # SSE: no buffering, no caching, long read timeout.
  location ~ ^/api/v1/experiments/[^/]+/events$ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header X-Request-Id $req_id;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header Cache-Control 'no-cache' always;
  }

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    client_max_body_size 128k;
  }

  # Hashed assets are immutable.
  location /assets/ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # SPA fallback; index.html must not be cached.
  location / {
    add_header Cache-Control 'no-cache';
    try_files $uri /index.html;
  }
}
